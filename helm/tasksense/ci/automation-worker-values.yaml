# CI: the automation worker in its own pod (AUTOMATION_RUNNER=external everywhere),
# two replicas, beside the sync worker, on a ReadWriteOnce data volume — both
# workers are scheduled onto the API's node — with Redis to wake it.
appUrl: https://tasksense.corp.internal
mongodbUri: mongodb://tasksense:0123456789abcdef@mongo-0.mongo:27017/?authSource=admin
storageSecret: ci-storage-secret-0123456789abcdef0123456789
firstAdminEmail: admin@corp.internal
redis:
  url: redis://:ci-redis-password@redis-0.redis:6379
automationWorker:
  enabled: true
  replicas: 2
