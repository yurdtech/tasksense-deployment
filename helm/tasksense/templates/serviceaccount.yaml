{{- include "tasksense.validate" . -}}
{{- if .Values.serviceAccount.create }}
# Its own identity, with no permissions: the application never talks to the
# Kubernetes API, so no token is mounted either.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "tasksense.serviceAccountName" . }}
  labels: {{- include "tasksense.labels" (dict "root" $ "component" "api") | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
{{- end }}
