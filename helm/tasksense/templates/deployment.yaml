{{- include "tasksense.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tasksense.fullname" . }}
  labels: {{- include "tasksense.labels" (dict "root" $ "component" "api") | nindent 4 }}
spec:
  {{- if not (include "tasksense.autoscaling" .) }}
  # One without Redis; up to 20 with it (see replicaCount in values.yaml).
  replicas: {{ int .Values.replicaCount }}
  {{- else }}
  # No `replicas:` — the HorizontalPodAutoscaler owns the count, and a value
  # here would reset it on every `helm upgrade`.
  {{- end }}
  revisionHistoryLimit: 5
  selector:
    matchLabels: {{- include "tasksense.selectorLabels" . | nindent 6 }}
  strategy:
    {{- if include "tasksense.rollingUpdate" . }}
    # Opt-in (Redis and a ReadWriteMany volume are required): new pods start
    # while the old ones serve, so two releases answer side by side for the
    # length of the rollout. Only for a release whose notes mark it
    # rolling-safe — docs/08-UPGRADE.md.
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ include "tasksense.str" (dig "rollingUpdate" "maxSurge" 1 .Values.strategy) }}
      maxUnavailable: {{ include "tasksense.str" (dig "rollingUpdate" "maxUnavailable" 0 .Values.strategy) }}
    {{- else }}
    # The default: the old pods stop before the new ones start, so two
    # releases never serve at once — the migrations that ran first may have
    # changed what the old one reads (and a ReadWriteOnce volume could not be
    # mounted by both anyway).
    type: Recreate
    {{- end }}
  template:
    metadata:
      labels:
        {{- include "tasksense.apiPodLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}{{- toYaml . | nindent 8 }}{{- end }}
      annotations:
        # Restarts the pod when chart-rendered configuration changes. Without
        # it, a `helm upgrade` that only alters a value leaves the old value
        # running. (A change inside an existingSecret needs
        # `kubectl rollout restart`.)
        checksum/config: {{ include "tasksense.configChecksum" . }}
        {{- with .Values.podAnnotations }}{{- toYaml . | nindent 8 }}{{- end }}
    spec:
      serviceAccountName: {{ include "tasksense.serviceAccountName" . }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ int .Values.terminationGracePeriodSeconds }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- include "tasksense.imagePullSecrets" (dict "root" $ "hook" false) | nindent 6 }}
      {{- include "tasksense.appPodSecurityContext" . | nindent 6 }}
      initContainers:
        {{- include "tasksense.prepareDataInitContainer" . | nindent 8 }}
      containers:
        - name: tasksense
          image: {{ include "tasksense.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # No command/args: the image's tini + `node dist/main.js`.
          {{- include "tasksense.containerSecurityContext" . | nindent 10 }}
          {{- if include "tasksense.preStop" . }}
          # A stopping pod is removed from the Service's endpoints at the same
          # moment it gets SIGTERM, and the ingress learns of it a few seconds
          # later. The sleep keeps it serving until then, so the requests and
          # live-update streams still routed to it are not cut; its peers take
          # the new ones. Counted inside terminationGracePeriodSeconds.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "{{ int .Values.preStopSleepSeconds }}"]
          {{- end }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env: {{- include "tasksense.processEnv" (dict "root" $ "role" "api" "heapMb" .Values.heapMb) | nindent 12 }}
          {{- include "tasksense.envFrom" (dict "root" $ "hook" false) | nindent 10 }}

          # Liveness must NOT touch MongoDB. /health and /health/ready both do,
          # and pointing this at either restarts the pod during a database
          # failover — the one moment when killing the application lengthens
          # the outage rather than ending it.
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          # Readiness must. MongoDB is the only data store, so an instance that
          # cannot reach it can serve nothing and should be taken out of the
          # Service until it can. With redis.* configured the same holds for
          # Redis: unreachable is 503 here, never a quiet fallback to memory.
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          # Covers the slow first boot: connecting, building indexes, and — with
          # migrations.enabled=false — applying migrations at boot (30 minutes
          # then, 5 otherwise). Generous, because the alternative is a pod
          # killed halfway through a schema change.
          startupProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            periodSeconds: 5
            failureThreshold: {{ ternary 60 360 (eq (toString .Values.migrations.enabled) "true") }}

          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /app/api/data
            # readOnlyRootFilesystem is on; small scratch only. Large staging
            # goes to TMPDIR on the data volume.
            - name: tmp
              mountPath: /tmp
            {{- include "tasksense.certsMount" . | nindent 12 }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        {{- include "tasksense.dataVolume" . | nindent 8 }}
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        {{- include "tasksense.certsVolume" (dict "root" $ "hook" false) | nindent 8 }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      {{- $selector := include "tasksense.selectorLabels" $ | fromYaml }}
      {{- $_ := set $selector "app.kubernetes.io/component" "api" }}
      {{- $spread := list }}
      {{- range . }}
      {{- $c := deepCopy . }}
      {{- if not (hasKey $c "labelSelector") }}
      {{- $_ := set $c "labelSelector" (dict "matchLabels" $selector) }}
      {{- end }}
      {{- $spread = append $spread $c }}
      {{- end }}
      topologySpreadConstraints: {{- toYaml $spread | nindent 8 }}
      {{- end }}
