{{- include "tasksense.validate" . -}}
{{- if .Values.backup.enabled }}
# Nightly mongodump of config.mongodbDatabase onto the backups claim. Covers
# the database only — the attachments on the data volume need a volume
# snapshot or your backup tooling (docs/07-BACKUP-DR.md).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "tasksense.suffixedName" (dict "root" $ "suffix" "backup" "max" 52) }}
  labels: {{- include "tasksense.labels" (dict "root" $ "component" "backup") | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  {{- with .Values.backup.timeZone }}
  timeZone: {{ . | quote }}
  {{- end }}
  suspend: {{ eq (toString .Values.backup.suspend) "true" }}
  concurrencyPolicy: Forbid
  # A run missed by more than an hour (controller down, cluster upgrade) is
  # skipped rather than started at a busy time of day.
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels: {{- include "tasksense.componentPodLabels" (dict "root" $ "component" "backup") | nindent 8 }}
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: {{ int .Values.backup.activeDeadlineSeconds }}
      template:
        metadata:
          labels: {{- include "tasksense.componentPodLabels" (dict "root" $ "component" "backup") | nindent 12 }}
          {{- with .Values.backup.podAnnotations }}
          annotations: {{- toYaml . | nindent 12 }}
          {{- end }}
        spec: {{- include "tasksense.dumpPodSpec" (dict "root" $ "hook" false "kind" "nightly" "prefix" "mongodump") | nindent 10 }}
{{- end }}
