{{- if and .Values.metrics.enabled .Values.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "tasksense.fullname" . }}
  labels:
    {{- include "tasksense.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}{{- toYaml . | nindent 4 }}{{- end }}
spec:
  selector:
    matchLabels: {{- include "tasksense.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /api/v1/metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      # The endpoint requires a bearer token: its gauges report seat usage,
      # user count and licence expiry, which is an inventory of the install.
      authorization:
        type: Bearer
        credentials:
          name: {{ include "tasksense.secretName" . }}
          key: METRICS_TOKEN
{{- end }}
