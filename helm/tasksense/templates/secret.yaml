{{- include "tasksense.validate" . -}}
{{- if not .Values.existingSecret }}
# The secret half of the configuration. Values in a Helm release are readable
# by anyone who can read the release; with Vault, sealed-secrets or an
# external-secrets operator set `existingSecret` instead — same key names.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tasksense.secretName" . }}
  labels: {{- include "tasksense.labels" (dict "root" $ "component" "config") | nindent 4 }}
type: Opaque
stringData: {{- include "tasksense.secretData" . | nindent 2 }}
{{- end }}
{{- if .Values.imageCredentials.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tasksense.registrySecretName" (dict "root" $ "hook" false) }}
  labels: {{- include "tasksense.labels" (dict "root" $ "component" "config") | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ include "tasksense.dockerconfigjson" . | b64enc }}
{{- end }}
