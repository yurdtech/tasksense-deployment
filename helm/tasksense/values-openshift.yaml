# OpenShift overlay. Put it BEFORE your own values file, so yours wins:
#
#   helm install tasksense oci://ghcr.io/yurdtech/charts/tasksense --version 1.1.0 \
#     -n tasksense -f values-openshift.yaml -f my-values.yaml --wait --timeout 30m
#
# The image already runs under the `restricted-v2` SCC unmodified — its files
# are owned by group 0 and group-writable where it writes, so the arbitrary uid
# OpenShift assigns can use them. No custom SCC, no ServiceAccount privileges.

# Forces the OpenShift posture even where the chart cannot detect it (helm
# template, a GitOps renderer without cluster access): no runAsUser, runAsGroup
# or fsGroup is pinned — the SCC assigns them from the namespace's range, and
# under restricted-v2 a pod asking for a specific uid is rejected at admission.
# The NetworkPolicy also switches to the router / openshift-dns / user-workload
# monitoring namespaces.
openshift:
  enabled: true

# Routes rather than Ingress: what the cluster's own router serves and what
# `oc get route` shows. route.host defaults to appUrl's host.
ingress:
  enabled: false

route:
  enabled: true
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
