{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tasksense.fullname" . }}-config
  labels: {{- include "tasksense.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Kept in a Secret rather than a ConfigMap because MONGODB_URI usually carries
  # credentials and STORAGE_SECRET always is one. Set `existingSecret` to supply
  # these from Vault, sealed-secrets or an external-secrets operator instead —
  # values in a Helm release are visible to anyone who can read it.
  APP_URL: {{ .Values.appUrl | quote }}
  CORS_ALLOWED_ORIGINS: {{ .Values.appUrl | quote }}
  MONGODB_URI: {{ .Values.mongodbUri | quote }}
  STORAGE_SECRET: {{ .Values.storageSecret | quote }}
  {{- with .Values.firstAdminEmail }}
  FIRST_ADMIN_EMAIL: {{ . | quote }}
  {{- end }}
  {{- with .Values.licenseKey }}
  LICENSE_KEY: {{ . | quote }}
  {{- end }}
  {{- if and .Values.metrics.enabled .Values.metrics.token }}
  METRICS_TOKEN: {{ .Values.metrics.token | quote }}
  {{- end }}
{{- end }}
