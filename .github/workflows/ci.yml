# Runs on every pull request and every push to main.
#
# The scripts here are the installation. A typo in them is not a broken build
# somebody notices at their desk — it is a customer.s engineer, on a host we cannot
# reach, reading an error we did not intend to write. So the checks are aimed at
# the failures that actually escaped review rather than at coverage: the ones
# below both come from bugs found by running this on a customer's distribution
# after it had passed everything else.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# A second push supersedes the first; there is nothing to deploy here.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned. The runner's own shellcheck is whatever Ubuntu shipped, and it
      # disagreed with the version on the machine these were written on: the
      # first run of this workflow failed on two findings that were clean
      # locally. A linter that reports different things in different places
      # cannot be a gate — it is a coin toss that occasionally blocks a merge.
      - name: install shellcheck 0.11.0
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz" \
            | tar -xJ --strip-components=1 -C /usr/local/bin shellcheck-v0.11.0/shellcheck
          shellcheck --version

      - name: shellcheck
        # -P SCRIPTDIR so `source=../lib.sh` resolves from the script that wrote
        # it rather than from wherever this happens to be invoked.
        run: shellcheck -x -P SCRIPTDIR tasksense scripts/*.sh scripts/wizard/*.sh tests/*.sh

      - name: every script is executable
        # A file that lost its executable bit still passes review and still
        # reads correctly in the diff. It fails on the customer's first command.
        run: |
          set -euo pipefail
          missing=0
          for f in tasksense scripts/*.sh scripts/wizard/*.sh tests/*.sh; do
            case "${f}" in scripts/lib.sh|scripts/ui.sh) continue ;; esac  # sourced, not run
            [ -x "${f}" ] || { echo "not executable: ${f}"; missing=1; }
          done
          exit "${missing}"

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: compose file — bundled, external MongoDB, import worker, replicas
        run: ./tests/compose-topologies.sh

      - uses: azure/setup-helm@v4
      # Every scenario lints and renders as an install AND as an upgrade; the
      # two security postures are audited on the rendered output; and every
      # guard — one API process without Redis, at most 20 with it, shared
      # storage, never half a Redis configuration, and the rest — must still
      # refuse with its own message: a guard that silently stops firing is
      # worse than none.
      - name: chart — scenarios, security posture, refusals
        run: |
          set -euo pipefail
          chart=helm/tasksense
          for f in "$chart"/ci/*-values.yaml; do
            echo "::group::$f"
            helm lint --strict "$chart" -f "$f"
            helm template tasksense "$chart" -f "$f" >/dev/null
            helm template tasksense "$chart" -f "$f" --is-upgrade >/dev/null
            echo "::endgroup::"
          done
          base="$chart/ci/default-values.yaml"
          [ "$(helm template t "$chart" -f "$base" | grep -c 'runAsUser:')" -gt 0 ]
          [ "$(helm template t "$chart" -f "$base" --api-versions route.openshift.io/v1 | grep -c 'runAsUser:')" -eq 0 ]
          [ "$(helm template t "$chart" -f "$chart/values-openshift.yaml" -f "$base" | grep -c 'runAsUser:')" -eq 0 ]
          helm template t "$chart" -f "$chart/ci/full-values.yaml" | grep -A1 'name: AGENT_EXECUTOR' | grep -q '"off"'
          # One pod keeps its pool and leaves the rate-limit store to the
          # application; five halve the pool, drain before SIGTERM and share
          # the web assets for a rolling update.
          single="$(helm template t "$chart" -f "$base")"
          grep -q 'MONGODB_MAX_POOL_SIZE: "100"' <<<"$single"
          if grep -qE 'RATE_LIMIT_STORE|REDIS_|preStop|WEB_ASSETS_SHARED_DIR' <<<"$single"; then echo "one pod renders multi-pod settings"; exit 1; fi
          multi="$(helm template t "$chart" -f "$chart/ci/multi-replica-values.yaml")"
          grep -q 'MONGODB_MAX_POOL_SIZE: "50"' <<<"$multi"
          grep -q 'replicas: 5' <<<"$multi"
          grep -q 'command: \["sleep", "10"\]' <<<"$multi"
          grep -q 'name: WEB_ASSETS_SHARED_DIR' <<<"$multi"
          grep -q 'kind: PodDisruptionBudget' <<<"$multi"
          hpa="$(helm template t "$chart" -f "$chart/ci/autoscaling-sentinel-values.yaml")"
          grep -q 'kind: HorizontalPodAutoscaler' <<<"$hpa"
          api="$(helm template t "$chart" -f "$chart/ci/autoscaling-sentinel-values.yaml" -s templates/deployment.yaml)"
          if grep -qE '^  replicas:' <<<"$api"; then echo "the API Deployment under an HPA still sets replicas"; exit 1; fi
          while IFS='|' read -r expect args; do
            [ -n "$expect" ] || continue
            # shellcheck disable=SC2086
            if out="$(helm template t "$chart" -f "$base" $args 2>&1)"; then echo "did not fail: $args"; exit 1; fi
            printf '%s' "$out" | grep -q -- "$expect" || { echo "wrong message for $args:"; echo "$out"; exit 1; }
          done <<'CASES'
          replicaCount=2 is not supported|--set replicaCount=2
          autoscaling.enabled=true is not supported|--set autoscaling.enabled=true
          podDisruptionBudget.enabled=true is not supported|--set podDisruptionBudget.enabled=true
          needs persistence.accessMode=ReadWriteMany|--set worker.enabled=true
          requires persistence.enabled=true|--set worker.enabled=true --set persistence.enabled=false
          storageSecret must be at least 32 characters|--set storageSecret=tooshort
          config.agentExecutor=on is not allowed|--set config.agentExecutor=on
          extraEnv.AGENT_EXECUTOR cannot be set|--set extraEnv.AGENT_EXECUTOR=on
          mutually exclusive|--set ingress.enabled=true --set route.enabled=true
          ingress.uploadMaxBody (21g) is smaller|--set ingress.enabled=true --set config.jiraBackupMaxGb=40
          metrics.token is required|--set metrics.enabled=true
          mongodbUri is required|--set mongodbUri=
          no certificate is mounted|--set certs.caBundle=corp-ca.pem
          leaves too little|--set heapMb=2000
          these values come from chart 1.0|--set config=null
          these values come from an earlier chart (no redis block)|--set redis=null
          replicaCount=3 is not supported without Redis|--set replicaCount=3 --set persistence.accessMode=ReadWriteMany
          strategy.type=RollingUpdate is not supported without Redis|--set strategy.type=RollingUpdate
          replicaCount=3 needs persistence.accessMode=ReadWriteMany (it is ReadWriteOnce)|--set replicaCount=3 --set redis.url=redis://redis:6379
          replicaCount=21 is above the supported maximum of 20|--set replicaCount=21 --set redis.url=redis://redis:6379 --set persistence.accessMode=ReadWriteMany
          autoscaling.maxReplicas=21 is above the supported maximum of 20|--set autoscaling.enabled=true --set autoscaling.maxReplicas=21 --set redis.url=redis://redis:6379 --set persistence.accessMode=ReadWriteMany
          redis: set exactly one connection|--set redis.url=redis://redis:6379 --set redis.sentinels=redis-0:26379 --set redis.sentinelName=mymaster
          config.rateLimitStore=memory with more than one API process|--set replicaCount=3 --set redis.url=redis://redis:6379 --set persistence.accessMode=ReadWriteMany --set config.rateLimitStore=memory
          config.rateLimitStore=redis needs Redis|--set config.rateLimitStore=redis
          redis.sentinels needs redis.sentinelName|--set redis.sentinels=redis-0:26379
          redis.password has no effect without a Redis connection|--set redis.password=secret
          redis.url is a secret|--set existingSecret=corp --set redis.url=redis://redis:6379
          must be at least preStopSleepSeconds + 20|--set replicaCount=2 --set redis.url=redis://redis:6379 --set persistence.accessMode=ReadWriteMany --set terminationGracePeriodSeconds=20
          jiraSync.enabled=true (the default) cannot run with persistence.accessMode=ReadWriteOncePod|--set persistence.accessMode=ReadWriteOncePod
          jiraSync.enabled=true (the default) requires persistence.enabled=true|--set persistence.enabled=false
          CASES
          for s in scripts/helm-airgap-bundle.sh scripts/helm-airgap-load.sh scripts/wizard/platform-helm.sh; do bash -n "$s"; done

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Each suite is its own step so a red build names the thing that broke,
      # rather than "tests failed".
      - name: fresh clone — the first command a customer runs
        run: ./tests/fresh-clone.sh

      - name: terminal rendering — locales a customer host actually has
        run: ./tests/terminal.sh

      - name: answers survive a run that stops
        run: ./tests/draft.sh

      - name: an operator's own MongoDB is actually used
        run: ./tests/external-db.sh

      - name: configuration renderer — .env stays equivalent to .env.example
        run: ./tests/wizard-render.sh

      # Skips loudly without a registry credential rather than passing quietly.
      # Add a read-only GHCR token as the GHCR_TOKEN secret to turn it on: it is
      # the only check that can tell whether the values we ship are ones the
      # application accepts, because the schema lives in the image.
      - name: .env.example is a configuration that starts
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -uo pipefail
          if [ -n "${GHCR_TOKEN:-}" ]; then
            printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u yurdtech --password-stdin
          fi
          ./tests/env-example.sh

      - name: lib.sh helpers and the 1.0 → 1.1 carry-over
        run: ./tests/lib-helpers.sh

      - name: preflight blocks what it must
        run: ./tests/preflight-checks.sh

      - name: install, backup, upgrade, rollback, restore (fake docker)
        run: ./tests/lifecycle.sh

      - name: verify-signature and load-images
        run: ./tests/release-tools.sh

      - name: the flow, driven through a real pty
        run: ./tests/wizard-flow.sh

      - name: the menu behaves
        run: ./tests/menu.sh

      - name: registry sign-in — stored, replaced, declined
        run: ./tests/registry-login.sh

      - name: reinstalling over an old database volume is explained
        run: ./tests/stale-volume.sh

      - name: generated passwords survive a MongoDB URI
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -uo pipefail
          if [ -n "${GHCR_TOKEN:-}" ]; then
            printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u yurdtech --password-stdin
          fi
          ./tests/mongo-uri.sh
