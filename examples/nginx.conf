# TaskSense behind nginx.
#
#   sudo cp examples/nginx.conf /etc/nginx/sites-available/tasksense
#   sudo ln -s /etc/nginx/sites-available/tasksense /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace tasksense.bank.internal and the certificate paths.

server {
    listen 80;
    server_name tasksense.bank.internal;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name tasksense.bank.internal;

    ssl_certificate     /etc/ssl/certs/tasksense.crt;
    ssl_certificate_key /etc/ssl/private/tasksense.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # The application sets its own CSP, HSTS and frame options; adding a second
    # set here is how they end up contradicting each other.

    access_log /var/log/nginx/tasksense-access.log;
    error_log  /var/log/nginx/tasksense-error.log;

    # Must be at least STORAGE_MAX_FILE_MB, or nginx rejects large uploads
    # before they reach the application and the error comes from the wrong place.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # Live updates are server-sent events: one response that stays open and
    # trickles out. Buffered, the interface looks frozen — changes appear only
    # when the buffer happens to flush — and the connection dies at the default
    # read timeout. Both stream paths need this; covering only one is a common
    # and confusing half-fix.
    location ~ ^/api/v1/(state|agents/events)/stream {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host       $host;
        proxy_set_header Connection '';

        proxy_buffering          off;
        proxy_cache              off;
        chunked_transfer_encoding off;
        proxy_read_timeout       24h;
    }

    # Fingerprinted asset filenames change on every release, so they can be
    # cached hard. index.html must not be, or an upgrade leaves browsers on the
    # old bundle talking to the new API.
    location /assets/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
