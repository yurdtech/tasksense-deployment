# TaskSense behind nginx (1.18 or newer).
#
#   sudo cp examples/nginx.conf /etc/nginx/conf.d/tasksense.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace tasksense.corp.internal (it must equal APP_URL in compose/.env) and
# the certificate paths. If nginx runs on another host than TaskSense, replace
# 127.0.0.1:3000 in the upstream with the TaskSense host, set BIND_ADDRESS in
# .env to the interface nginx reaches, and allow only nginx in the firewall.
#
# What this file gets right, and why each one matters:
#
#   1. Keep-alive to the upstream (proxy_http_version 1.1 + Connection "").
#      The application keeps idle sockets for 65 s; nginx gives up its side
#      after 60 s, so nginx always closes first and a POST is never sent down a
#      socket the application is closing.
#   2. X-Forwarded-For / X-Real-IP / X-Forwarded-Proto on EVERY location. The
#      application trusts exactly one proxy hop for the client address (rate
#      limits and sign-in lockout count per client) and builds links from the
#      scheme. A location that forgets them puts every user behind 127.0.0.1.
#   3. The two live-update streams unbuffered, for 24 h.
#   4. Uploads streamed straight through (proxy_request_buffering off), with a
#      body limit large enough for a Jira site backup and timeouts long enough
#      to receive it. Everything else keeps a 25 MB limit.
#   5. A log line without query strings or path tokens. The streams and video
#      playback authenticate with ?ticket=…, and a few integration routes carry
#      their credential in the path. None of that belongs in an access log.
#
# The application sets its own Content-Security-Policy, HSTS, X-Frame-Options
# and Referrer-Policy. Do not add a second set here — two sets end up
# contradicting each other, and the browser enforces both.

# ── Logging ──────────────────────────────────────────────────────────────────
#
# $uri is the path only, already decoded, with no query string. The map below
# also masks the routes whose credential is part of the path (the same four the
# application masks in its own log). $http_referer is left out on purpose: a
# referer can carry a query string too.
map $uri $tasksense_log_uri {
    ~^(?<p>/api/v1/(?:inbound-mail|service-desk/inbound|invites|automation/hooks)/)[^/]+(?<rest>.*)$  "${p}***${rest}";
    default  $uri;
}

log_format tasksense '$remote_addr [$time_local] "$request_method $tasksense_log_uri $server_protocol" '
                     '$status $body_bytes_sent $request_length '
                     'rt=$request_time urt=$upstream_response_time '
                     'rid=$request_id ua="$http_user_agent"';

# ── Upstream ─────────────────────────────────────────────────────────────────
upstream tasksense {
    server 127.0.0.1:3000;

    # Idle connections kept open to the application, per nginx worker.
    keepalive 32;
    # Below the application's 65 s keep-alive (see 1. above).
    keepalive_timeout 60s;
}

server {
    listen 80;
    server_name tasksense.corp.internal;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;                      # nginx < 1.25.1: use "listen 443 ssl http2;" instead
    server_name tasksense.corp.internal;

    ssl_certificate     /etc/ssl/certs/tasksense.crt;      # full chain, issued by your CA
    ssl_certificate_key /etc/ssl/private/tasksense.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:tasksense:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/tasksense-access.log tasksense;
    # nginx writes the full request line (query string included) into the
    # ERROR log when a request fails at the proxy. A ?ticket= found there has
    # long expired — 60 s for a stream, 1 h for a video — and no session token
    # is ever in a URL; restrict the file all the same.
    error_log  /var/log/nginx/tasksense-error.log warn;

    # Default request-body limit for everything that is not an upload route
    # below. Ordinary API calls are JSON well under 10 MB (the application's
    # own JSON limit), so this is generous.
    client_max_body_size 25m;

    # ── Live updates (server-sent events) ────────────────────────────────────
    # One response that stays open and trickles out. Buffered, the interface
    # looks frozen — changes appear only when a buffer happens to flush — and
    # the connection dies at the default 60 s read timeout. Both stream paths
    # need this; covering only one is a common and confusing half-fix.
    location ~ ^/api/v1/(state|agents/events)/stream$ {
        proxy_pass http://tasksense;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id      $request_id;

        proxy_buffering           off;
        proxy_cache               off;
        chunked_transfer_encoding off;
        proxy_read_timeout        24h;
        proxy_send_timeout        24h;
    }

    # ── Uploads and long-running imports ─────────────────────────────────────
    # The routes that receive files:
    #
    #   /api/v1/integrations/jira/backup           Jira site backup (entities.xml)
    #   /api/v1/integrations/jira/backup/<id>/activeobjects | /media
    #   /api/v1/integrations/{jira,confluence,csv}/import…   API and file imports
    #   /api/v1/import/archive | /workspace        workspace restore (admin)
    #   /api/v1/tasks/<id>/attachments             task attachments, incl. video
    #   /api/v1/docs/<id>/attachments              document attachments
    #   /rest/api/{2,3}/issue/<key>/attachments    Jira-compatible API
    #
    # 21g sits just above JIRA_BACKUP_MAX_GB (20 GB by default). The application
    # enforces the real per-route ceilings itself — STORAGE_MAX_FILE_MB (25),
    # STORAGE_MAX_VIDEO_FILE_MB (200), JIRA_BACKUP_MAX_GB — and answers 413
    # with a readable message, so this limit only has to be at least as large.
    # If you raise JIRA_BACKUP_MAX_GB, raise this with it.
    #
    # proxy_request_buffering off is not an optimisation. With buffering on,
    # nginx first writes the whole body to its own disk (client_body_temp_path)
    # and only then starts sending it on: a 13 GB upload needs 13 GB free on the
    # proxy's disk, doubles the time, and when that disk fills EVERY upload
    # fails with 408 while reads stay healthy.
    #
    # Four hours matches the application's own request ceiling: the largest
    # backup arriving at about 12 Mbit/s.
    location ~ ^/api/v1/(integrations/(jira|confluence|csv)/|import/) {
        proxy_pass http://tasksense;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id      $request_id;

        client_max_body_size    21g;
        client_body_timeout     300s;     # between two reads, not the total
        proxy_request_buffering off;
        proxy_connect_timeout   10s;
        proxy_send_timeout      4h;
        proxy_read_timeout      4h;
    }

    location ~ ^/(api/v1/(tasks|docs)/[^/]+|rest/api/[23]/issue/[^/]+)/attachments/?$ {
        proxy_pass http://tasksense;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id      $request_id;

        client_max_body_size    21g;      # same value as above, so Helm and nginx agree
        client_body_timeout     300s;
        proxy_request_buffering off;
        proxy_connect_timeout   10s;
        proxy_send_timeout      1h;
        proxy_read_timeout      1h;
    }

    # ── Exports and reports ──────────────────────────────────────────────────
    # A workspace export or a large report can take minutes to start
    # answering on a migrated workspace.
    location ^~ /api/v1/export/ {
        proxy_pass http://tasksense;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id      $request_id;

        proxy_read_timeout 1h;
    }

    # ── Static assets ────────────────────────────────────────────────────────
    # Files under /assets/ are content-hashed: a changed file is a new URL, so
    # an existing one can be cached for a year. The application already sends
    # "Cache-Control: public, max-age=31536000, immutable" for files that exist,
    # "no-cache" for index.html, and a plain 404 for a hashed file that does not
    # exist (a tab still holding the previous release asking for a deleted
    # chunk). Keep it that way:
    #
    #   - no try_files and no fallback to index.html here — a script URL
    #     answered with HTML and a 200 breaks the page in a way that is hard to
    #     diagnose, and a browser would cache it;
    #   - add_header WITHOUT "always", so the long cache lifetime is only ever
    #     attached to a successful response, never to a 404.
    location ^~ /assets/ {
        proxy_pass http://tasksense;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id      $request_id;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Optional: keep the API reference off the user network ────────────────
    # With SWAGGER_ENABLED=false (recommended) /api/v1/swagger answers 404. The
    # static API reference (/api-docs) and the product guide (/docs) are always
    # served without sign-in. To limit them to an internal segment, uncomment
    # and adjust; repeat the block for "location = /docs" and
    # "location ^~ /docs/" if the product guide should be restricted too.
    # (/api/v1/docs is a different thing — the documents API the web interface
    # itself calls — and must stay reachable.)
    #
    # location ^~ /api-docs {
    #     allow 10.20.0.0/16;    # e.g. the development segment
    #     deny  all;
    #     proxy_pass http://tasksense;
    #     proxy_http_version 1.1;
    #     proxy_set_header Connection        "";
    #     proxy_set_header Host              $host;
    #     proxy_set_header X-Real-IP         $remote_addr;
    #     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # ── Everything else: the web interface and the API ───────────────────────
    location / {
        proxy_pass http://tasksense;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id      $request_id;

        proxy_connect_timeout 10s;
        # Most requests answer in milliseconds. A few admin operations on a
        # large migrated workspace (restoring a project from the trash, a
        # report over hundreds of thousands of tasks) take longer than nginx's
        # default 60 s.
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
    }
}
