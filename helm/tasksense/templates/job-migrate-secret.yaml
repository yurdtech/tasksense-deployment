{{- if and .Values.migrations.hook.enabled (eq .Values.migrations.onBoot "manual") (not .Values.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tasksense.fullname" . }}-migrate
  labels: {{- include "tasksense.labels" . | nindent 4 }}
  annotations:
    # A copy of the configuration, for the migration hook only.
    #
    # Helm applies hooks *before* the release's ordinary resources, so the main
    # Secret does not exist yet when the pre-install Job runs — the Job fails
    # with `CreateContainerConfigError: secret not found`, and the install times
    # out waiting for a pod that can never start.
    #
    # A hook-annotated copy at a lower weight is created first. The alternative,
    # annotating the main Secret as a hook, would take it out of the release
    # entirely: `helm uninstall` would leave it behind, and `helm upgrade`
    # would stop tracking changes to it.
    #
    # Deleted as soon as the hook succeeds, so the duplicate does not outlive
    # the migration that needed it.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
type: Opaque
stringData:
  APP_URL: {{ .Values.appUrl | quote }}
  MONGODB_URI: {{ .Values.mongodbUri | quote }}
  STORAGE_SECRET: {{ .Values.storageSecret | quote }}
  {{- with .Values.firstAdminEmail }}
  FIRST_ADMIN_EMAIL: {{ . | quote }}
  {{- end }}
{{- end }}
